[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-watcher"
version = "0.1.0"
description = "Automated voice note ingestion, Whisper transcription, Obsidian RAG, and LLM formatting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
whisper-watcher = "run:main"
